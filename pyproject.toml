[project]
name = "b3-acoes-pilot"
version = "0.5.0"
description = "Assistente quantitativo local-first para Swing Trade, Proventos e DARF na B3 com conectores multi-IA e alertas Telegram."
authors = [
    { name = "Ricardo Neves (EdConnect Tecnologia Ltda)", email = "ricardo@edconnect.com.br" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "pandas-ta>=0.4.67b0",
    "sqlalchemy>=2.0.30",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pytest>=8.2.0",
]

[project.urls]
Homepage = "https://edconnect.com.br"
Repository = "https://github.com/edconnect-tech/b3-acoes-pilot"
Issues = "https://github.com/edconnect-tech/b3-acoes-pilot/issues"
Funding = "https://github.com/sponsors/edconnect-tech"

[project.scripts]
b3pilot = "b3pilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["b3pilot"]
