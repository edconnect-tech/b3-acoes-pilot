[project]
name = "b3-acoes-pilot"
version = "0.1.0"
description = "Antigravity CLI native Swing Trade and Dividend Assistant for Brazilian Stocks (B3)"
authors = [{ name = "Ricardo Neves" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "sqlalchemy>=2.0.30",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pytest>=8.2.0",
]

[project.scripts]
b3pilot = "b3pilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["b3pilot"]
